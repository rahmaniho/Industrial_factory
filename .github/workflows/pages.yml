name: انتشار در گیت‌هاب پیج (Pages)

on:
  push:
    branches: ["main", "arena/**"]
  workflow_dispatch:

# مجوزهای لازم برای استقرار در Pages
permissions:
  contents: read
  pages: write
  id-token: write

# فقط یک استقرار هم‌زمان؛ استقرارِ در حال اجرا لغو نمی‌شود
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: آماده‌سازی Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: بازتولید مستندات و اجرای تست‌ها
        run: |
          python3 tools/build_integration_matrix.py
          python3 tools/build_catalogs.py
          python3 tools/build_templates.py
          python3 tools/test_build.py
          node tools/test_site.js

      # چیدمانِ بسته در tools/build_site.py است؛ همان اسکریپت را Vercel هم اجرا
      # می‌کند، پس دو میزبان هیچ‌وقت از هم جدا نمی‌افتند. اسکریپت در پایان
      # خودش همهٔ منابعِ لازم را بررسی می‌کند و اگر نبود، workflow می‌شکند.
      - name: ساخت پوشهٔ انتشار
        run: |
          python3 tools/build_site.py --out _site
          test -f _site/index.html

      - name: بارگذاریِ artifact
        # v4 به بعد: نسخهٔ v3 داخلِ خودش actions/upload-artifact@v4 را بدونِ SHA صدا
        # می‌زد و سیاستِ «قفلِ اکشن به SHAِ کامل» همین را رد می‌کند (Set up job می‌شکست).
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: _site

  # استقرار فقط از شاخهٔ پیش‌فرض: GitHub Pages یک سایتِ تولیدی دارد و API آن
  # استقرارِ شاخه‌های دیگر را رد می‌کند؛ روی arena/** این گام اجرا نمی‌شود تا
  # نتیجهٔ workflow پیامِ «بستهٔ انتشار» باشد، نه خطایِ استقرار.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: استقرار
        id: deployment
        # توجه: deploy-pages هیچ input به نام enablement ندارد؛ فعال‌کردنِ Pages
        # فقط از Settings → Pages ممکن است (زیر این گام توضیح داده شده است).
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

      - name: نشانیِ صفحه
        if: always()
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "✓ منتشر شد: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::warning::استقرار انجام نشد. اگر نخستین اجراست، یک‌بار در"
            echo "::warning::Settings → Pages → Source را روی «GitHub Actions» بگذارید."
          fi
