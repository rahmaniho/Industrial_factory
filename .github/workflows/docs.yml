name: مستندات (Docs)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: اعتبارسنجی و بازتولید
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: بازتولید مستندات از CSV
        run: |
          python3 tools/build_integration_matrix.py
          python3 tools/build_catalogs.py
          python3 tools/build_templates.py

      - name: بررسیِ به‌روزبودنِ خروجی‌ها
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::مستنداتِ تولید‌شده با CSVها هم‌خوان نیستند."
            echo "مولّد را اجرا و خروجی را همراه تغییر CSV کامیت کنید."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
          echo "✓ مستندات با منابع داده هم‌خوان‌اند"

      - name: آماده‌سازی Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      # دقیقاً همان بسته‌ای که Pages و Vercel منتشر می‌کنند اینجا سنجیده می‌شود:
      # نبودنِ index.html در ریشهٔ بسته یعنی ۴۰۴ روی میزبان، پس زودتر می‌گیریمش.
      - name: اعتبارسنجیِ بستهٔ انتشار
        run: python3 tools/build_site.py --check

      - name: اجرای تست‌ها
        run: |
          python3 tools/test_build.py
          node tools/test_site.js

      - name: آمار مخزن
        run: |
          echo "تعداد مستندات: $(ls docs/*.md | wc -l)"
          echo "تعداد مستندات واحد: $(ls docs/03-units/*.md | wc -l)"
          echo "ردیف‌های داده:"
          for f in data/*.csv; do
            echo "  $(basename "$f"): $(( $(wc -l < "$f") - 1 ))"
          done
